# Retail & Supply Chain Control Tower - PostgreSQL + Apache Airflow + Apache Superset
# Usage:  cp .env.example .env  (edit secrets)  &&  docker compose up -d --build
x-airflow-common: &airflow-common
  build: .
  image: control-tower-airflow:2.10.5
  env_file: .env
  environment: &airflow-env
    POSTGRES_HOST: postgres
    PROJECT_ROOT: /opt/project
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./:/opt/project
  user: "${AIRFLOW_UID:-50000}:0"
  networks: [control-tower]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: ct-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PROJECT_DB: ${POSTGRES_DB}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [control-tower]

  airflow-init:
    <<: *airflow-common
    container_name: ct-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Control --lastname Tower --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: ct-airflow-webserver
    command: webserver
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: ct-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset:
    build: ./docker/superset
    image: control-tower-superset:4.1.2
    container_name: ct-superset
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports: ["8088:8088"]
    command: >
      bash -c "superset db upgrade &&
               superset fab create-admin --username $${SUPERSET_ADMIN_USER} --password $${SUPERSET_ADMIN_PASSWORD}
                 --firstname Control --lastname Tower --email admin@example.com || true &&
               superset init &&
               gunicorn --bind 0.0.0.0:8088 --workers 3 --timeout 120 'superset.app:create_app()'"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control-tower]

volumes:
  pgdata:

networks:
  control-tower:
